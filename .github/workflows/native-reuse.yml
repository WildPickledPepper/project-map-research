name: Native dataflow providers
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        default: all
        options: [all, svf, rapx, rust-svf, svf-replay, rust-analyze, rapx-linux-debug, rust-release, rust-windows-release]
      compiler-run:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  svf:
    if: inputs.provider == 'all' || inputs.provider == 'svf'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-16 graphviz
          python -m pip install pysvf==1.0.0.50 cmake==3.31.6 ninja==1.11.1.4
      - name: Capture native distribution and smoke input
        run: |
          mkdir -p "$RUNNER_TEMP/svf-output"
          python - <<'PY'
          import pathlib, pysvf, json, os, inspect
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'svf-output'
          root=pathlib.Path(pysvf.__file__).parent
          (out/'distribution.json').write_text(json.dumps({'module':str(root),'symbols':dir(pysvf)},indent=2))
          print(root)
          print(dir(pysvf))
          PY
          clang++-16 -g -O0 -Xclang -disable-O0-optnone -emit-llvm -c experiments/2026-10-26-reuse-audit/joern-probe.cpp -o "$RUNNER_TEMP/svf-output/probe.bc"
          python - <<'PY'
          import pathlib,pysvf,os,subprocess,json
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'svf-output'
          root=pathlib.Path(pysvf.__file__).parent
          binaries=list(root.rglob('wpa'))
          results=[]
          for p in binaries:
              for args in [['-help'],['-ander','-svfg','-dump-vfg','-dump-pag','-write-ander=points-to.txt',str(out/'probe.bc')]]:
                  r=subprocess.run([str(p),*args],cwd=out,capture_output=True,text=True,timeout=180)
                  (out/('help.log' if args[0]=='-help' else 'analysis.log')).write_text(r.stdout+'\n'+r.stderr)
                  results.append({'arguments':args,'exit_code':r.returncode})
          (out/'native-cli.json').write_text(json.dumps({'binaries':[str(p) for p in binaries],'results':results},indent=2))
          print(json.dumps(results))
          assert binaries and all(r['exit_code']==0 for r in results)
          PY
          python -m adapters.svf_export --bitcode "$RUNNER_TEMP/svf-output/probe.bc" --native-points "$RUNNER_TEMP/svf-output/points-to.txt" --output "$RUNNER_TEMP/svf-output/native.json" --source-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --context fixture/release --module native-probe
      - name: Prepare real native CMake context
        run: python experiments/2026-10-26-r0-r1/prepare_insight_linux.py --output "$RUNNER_TEMP/insight-native"
      - name: Analyze native first-party executable inputs
        run: python experiments/2026-10-26-r0-r1/run_svf_compilation.py --repository "$RUNNER_TEMP/insight-native/repository" --cmake-capture "$RUNNER_TEMP/insight-native/cmake" --output "$RUNNER_TEMP/svf-output/insight" --clang /usr/bin/clang++-16 --llvm-link /usr/bin/llvm-link-16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svf-native-output
          path: ${{ runner.temp }}/svf-output
          retention-days: 7
  svf-replay:
    if: inputs.provider == 'svf-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing LLVM and SVF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-16
          python -m pip install pysvf==1.0.0.50
      - uses: actions/download-artifact@v4
        with:
          name: svf-native-output
          run-id: 40289634814
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/compiled
      - name: Reuse native compiler output with LLVM preprocessing
        run: python experiments/2026-10-26-r0-r1/replay_svf_native.py --input "$RUNNER_TEMP/compiled" --output "$RUNNER_TEMP/svf-replay-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svf-replay-output
          path: ${{ runner.temp }}/svf-replay-output
          retention-days: 7
  rapx:
    if: inputs.provider == 'all' || inputs.provider == 'rapx' || inputs.provider == 'rapx-linux-debug'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: safer-rust/RAPx
          ref: 974eb8e7f91e186720daffdfdf1125c3daf6c8cb
          path: native-tools/rapx
          persist-credentials: false
      - name: Install upstream compiler and solver requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libz3-dev graphviz libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustc-dev,rust-src,llvm-tools-preview
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-tools/rapx/target
          key: rapx-974eb8e-nightly-2026-07-21-linux22-1
      - name: Build existing analysis engine
        run: |
          python scripts/prepare_rapx_export.py --checkout native-tools/rapx
          cd native-tools/rapx
          cargo build --release --package rapx --locked
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-tools/rapx/target
          key: rapx-974eb8e-nightly-2026-07-21-linux22-1
      - name: Execute upstream dataflow and alias fixtures
        if: inputs.provider != 'rapx-linux-debug'
        run: |
          mkdir -p "$RUNNER_TEMP/rapx-output"
          export PATH="$GITHUB_WORKSPACE/native-tools/rapx/target/release:$PATH"
          export LD_LIBRARY_PATH="$(rustc --print sysroot)/lib:${LD_LIBRARY_PATH:-}"
          export RAPX_CLEAN=false
          export PROJECT_MAP_RAPX_EXPORT="$RUNNER_TEMP/rapx-output/native"
          export PROJECT_MAP_SOURCE_ROOT="$GITHUB_WORKSPACE/native-tools/rapx/rapx/tests/analyze/alias_1"
          export PROJECT_MAP_SOURCE_COMMIT="$GITHUB_SHA"
          export PROJECT_MAP_CONTEXT="fixture/release"
          cargo rapx --help > "$RUNNER_TEMP/rapx-output/help.log"
          cd native-tools/rapx/rapx/tests/analyze/alias_1
          cargo rapx analyze dataflow --debug > "$RUNNER_TEMP/rapx-output/dataflow.log" 2>&1
          cargo rapx analyze alias > "$RUNNER_TEMP/rapx-output/alias.log" 2>&1
          rustc --version > "$RUNNER_TEMP/rapx-output/rustc-version.log"
      - name: Execute independent Rust admission cases
        if: inputs.provider != 'rapx-linux-debug'
        run: |
          export PATH="$GITHUB_WORKSPACE/native-tools/rapx/target/release:$PATH"
          export LD_LIBRARY_PATH="$(rustc --print sysroot)/lib:${LD_LIBRARY_PATH:-}"
          export RAPX_CLEAN=false
          mkdir -p "$RUNNER_TEMP/rust-flow/src"
          cp experiments/2026-10-26-r0-r1/rust-dataflow.rs "$RUNNER_TEMP/rust-flow/src/lib.rs"
          printf '[package]\nname="neutral_flow"\nversion="0.1.0"\nedition="2021"\n[workspace]\n' > "$RUNNER_TEMP/rust-flow/Cargo.toml"
          export PROJECT_MAP_RAPX_EXPORT="$RUNNER_TEMP/rapx-output/admission"
          export PROJECT_MAP_SOURCE_ROOT="$RUNNER_TEMP/rust-flow"
          export PROJECT_MAP_SOURCE_COMMIT="$GITHUB_SHA"
          export PROJECT_MAP_CONTEXT="fixture/independent"
          cd "$RUNNER_TEMP/rust-flow"
          cargo test > "$RUNNER_TEMP/rapx-output/independent-execution.log" 2>&1
          cargo rapx analyze dataflow > "$RUNNER_TEMP/rapx-output/independent-analysis.log" 2>&1
      - name: Read pinned Insight source and analyze HTTP mode
        run: |
          git init -q "$RUNNER_TEMP/insight"
          git -C "$RUNNER_TEMP/insight" fetch --depth 1 https://gitcode.com/Ascend/msinsight.git d4e8d1cf9f90208bcbe5371c127088f6fd66c688
          git -C "$RUNNER_TEMP/insight" checkout --detach -q FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/rapx-output"
          if [ "${{ inputs.provider }}" = rapx-linux-debug ]; then exit 0; fi
          export PATH="$GITHUB_WORKSPACE/native-tools/rapx/target/release:$PATH"
          export LD_LIBRARY_PATH="$(rustc --print sysroot)/lib:${LD_LIBRARY_PATH:-}"
          export RAPX_CLEAN=false
          export PROJECT_MAP_RAPX_EXPORT="$RUNNER_TEMP/rapx-output/insight-http"
          export PROJECT_MAP_SOURCE_ROOT="$RUNNER_TEMP/insight"
          export PROJECT_MAP_SOURCE_COMMIT=d4e8d1cf9f90208bcbe5371c127088f6fd66c688
          export PROJECT_MAP_CONTEXT="platform/linux-http"
          cd "$RUNNER_TEMP/insight/platform"
          cargo rapx analyze dataflow -- --no-default-features --features http > "$RUNNER_TEMP/rapx-output/insight-http.log" 2>&1
      - name: Analyze actual Linux desktop mode
        run: |
          export PATH="$GITHUB_WORKSPACE/native-tools/rapx/target/release:$PATH"
          export LD_LIBRARY_PATH="$(rustc --print sysroot)/lib:${LD_LIBRARY_PATH:-}"
          export RAPX_CLEAN=false
          export PROJECT_MAP_RAPX_EXPORT="$RUNNER_TEMP/rapx-output/insight-linux-desktop"
          export PROJECT_MAP_SOURCE_ROOT="$RUNNER_TEMP/insight"
          export PROJECT_MAP_SOURCE_COMMIT=d4e8d1cf9f90208bcbe5371c127088f6fd66c688
          export PROJECT_MAP_CONTEXT="platform/linux-desktop-release"
          cd "$RUNNER_TEMP/insight/platform/linux"
          if [ "${{ inputs.provider }}" = rapx-linux-debug ]; then
            export PROJECT_MAP_RAPX_EXPORT="$RUNNER_TEMP/rapx-output/insight-linux-desktop-debug"
            export PROJECT_MAP_CONTEXT="platform/linux-desktop-debug"
            cargo rapx analyze dataflow > "$RUNNER_TEMP/rapx-output/insight-linux-debug.log" 2>&1
            exit 0
          fi
          cargo rapx analyze dataflow -- --release > "$RUNNER_TEMP/rapx-output/insight-linux-desktop.log" 2>&1
      - name: Analyze actual Windows desktop configurations
        if: inputs.provider != 'rapx-linux-debug'
        run: |
          rustup target add x86_64-pc-windows-gnu
          export PATH="$GITHUB_WORKSPACE/native-tools/rapx/target/release:$PATH"
          export LD_LIBRARY_PATH="$(rustc --print sysroot)/lib:${LD_LIBRARY_PATH:-}"
          export RAPX_CLEAN=false
          export PROJECT_MAP_SOURCE_ROOT="$RUNNER_TEMP/insight"
          export PROJECT_MAP_SOURCE_COMMIT=d4e8d1cf9f90208bcbe5371c127088f6fd66c688
          cd "$RUNNER_TEMP/insight/platform"
          export PROJECT_MAP_RAPX_EXPORT="$RUNNER_TEMP/rapx-output/insight-windows-desktop-release"
          export PROJECT_MAP_CONTEXT="platform/windows-desktop-release"
          cargo rapx analyze dataflow -- --target x86_64-pc-windows-gnu --release > "$RUNNER_TEMP/rapx-output/insight-windows-release.log" 2>&1
          export PROJECT_MAP_RAPX_EXPORT="$RUNNER_TEMP/rapx-output/insight-windows-desktop-debug"
          export PROJECT_MAP_CONTEXT="platform/windows-desktop-debug"
          cargo rapx analyze dataflow -- --target x86_64-pc-windows-gnu > "$RUNNER_TEMP/rapx-output/insight-windows-debug.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapx-native-output
          path: ${{ runner.temp }}/rapx-output
          retention-days: 7
  rust-svf:
    if: inputs.provider == 'all' || inputs.provider == 'rust-svf' || inputs.provider == 'rust-release' || inputs.provider == 'rust-windows-release'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing LLVM-compatible compiler and analysis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev binutils-mingw-w64-x86-64
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-svf-1.94.0-linux22-1
      - name: Execute independent Rust compiler value-flow cases
        run: |
          mkdir -p "$RUNNER_TEMP/rust-flow/src"
          cp experiments/2026-10-26-r0-r1/rust-dataflow.rs "$RUNNER_TEMP/rust-flow/src/lib.rs"
          printf '[package]\nname="neutral_flow"\nversion="0.1.0"\nedition="2021"\n[workspace]\n' > "$RUNNER_TEMP/rust-flow/Cargo.toml"
          python scripts/capture_cargo_value_flow.py --compile-only --manifest "$RUNNER_TEMP/rust-flow/Cargo.toml" --source-root "$RUNNER_TEMP/rust-flow" --output "$RUNNER_TEMP/rust-svf-output/admission" --source-commit "$GITHUB_SHA" --context fixture/independent --release
      - name: Read pinned product source
        run: |
          git init -q "$RUNNER_TEMP/insight"
          git -C "$RUNNER_TEMP/insight" fetch --depth 1 https://gitcode.com/Ascend/msinsight.git d4e8d1cf9f90208bcbe5371c127088f6fd66c688
          git -C "$RUNNER_TEMP/insight" checkout --detach -q FETCH_HEAD
      - name: Analyze native Rust application configurations
        run: |
          if [ "${{ inputs.provider }}" != rust-release ] && [ "${{ inputs.provider }}" != rust-windows-release ]; then
            python scripts/capture_cargo_value_flow.py --compile-only --manifest "$RUNNER_TEMP/insight/platform/Cargo.toml" --source-root "$RUNNER_TEMP/insight" --output "$RUNNER_TEMP/rust-svf-output/insight-http" --source-commit d4e8d1cf9f90208bcbe5371c127088f6fd66c688 --context platform/linux-http --no-default-features --features http
          fi
          if [ "${{ inputs.provider }}" != rust-windows-release ]; then
            python scripts/capture_cargo_value_flow.py --compile-only --manifest "$RUNNER_TEMP/insight/platform/linux/Cargo.toml" --source-root "$RUNNER_TEMP/insight" --output "$RUNNER_TEMP/rust-svf-output/insight-linux-desktop" --source-commit d4e8d1cf9f90208bcbe5371c127088f6fd66c688 --context platform/linux-desktop-release --release
          fi
          python scripts/capture_cargo_value_flow.py --compile-only --manifest "$RUNNER_TEMP/insight/platform/Cargo.toml" --source-root "$RUNNER_TEMP/insight" --output "$RUNNER_TEMP/rust-svf-output/insight-windows-release" --source-commit d4e8d1cf9f90208bcbe5371c127088f6fd66c688 --context platform/windows-desktop-release --target x86_64-pc-windows-gnu --release --analysis-optimization 0
          if [ "${{ inputs.provider }}" != rust-release ] && [ "${{ inputs.provider }}" != rust-windows-release ]; then
            python scripts/capture_cargo_value_flow.py --compile-only --manifest "$RUNNER_TEMP/insight/platform/Cargo.toml" --source-root "$RUNNER_TEMP/insight" --output "$RUNNER_TEMP/rust-svf-output/insight-windows-debug" --source-commit d4e8d1cf9f90208bcbe5371c127088f6fd66c688 --context platform/windows-desktop-debug --target x86_64-pc-windows-gnu
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-compiler-output
          path: |
            ${{ runner.temp }}/rust-svf-output/*/program.bc
            ${{ runner.temp }}/rust-svf-output/*/receipt.json
            ${{ runner.temp }}/rust-svf-output/*/compile.log
            ${{ runner.temp }}/rust-svf-output/*/native-cfg.txt
          retention-days: 7
  rust-svf-analysis:
    if: always() && (needs.rust-svf.result != 'skipped' || inputs.provider == 'rust-analyze')
    needs: rust-svf
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing SVF and Rust symbol formatter
        run: |
          python -m pip install pysvf==1.0.0.50
          cargo install rustfilt --locked
      - uses: actions/download-artifact@v4
        with:
          name: rust-compiler-output
          path: ${{ runner.temp }}/rust-svf-output
          run-id: ${{ inputs.compiler-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Analyze native compiler outputs
        run: python scripts/analyze_svf_captures.py --input "$RUNNER_TEMP/rust-svf-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-svf-native-output
          path: ${{ runner.temp }}/rust-svf-output
          retention-days: 7
