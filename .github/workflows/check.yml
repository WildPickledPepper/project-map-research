name: Check research references
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_research.py
      - run: python scripts/check_trial_evidence.py
      - run: python scripts/check_p1_evidence.py
      - run: python scripts/check_p1_completion.py
      - run: python scripts/check_p2_completion.py
      - run: python scripts/check_p3_increment.py
      - run: python scripts/check_p3_selection.py
      - run: python scripts/check_p3_output_fields.py
      - run: python scripts/check_p3_serialization.py
      - run: python scripts/check_p3_response_routing.py
      - run: python scripts/check_p3_frontend_consumers.py
      - run: python scripts/check_p3_response_callbacks.py
      - run: python scripts/check_p3_request_correlation.py
      - run: python scripts/check_p3_transmission.py
      - run: python scripts/check_p3_socket_receivers.py
      - run: python scripts/check_p3_server_channels.py
      - run: python scripts/check_p3_return_bridge.py
      - run: python scripts/check_p3_completion.py
      - run: python experiments/2026-10-24-p5/check_completion.py
      - run: python experiments/2026-10-24-p7/check_completion.py
      - run: python experiments/2026-10-24-a1/check_completion.py
      - run: python experiments/2026-10-24-a2/check_completion.py
      - run: python experiments/2026-10-24-a3/check_completion.py
      - run: python experiments/2026-10-24-a4/check_evidence.py
      - run: python experiments/2026-10-24-a4-repair/check_completion.py
      - run: python experiments/2026-10-25-static-async/check_completion.py
      - run: python experiments/2026-10-25-a5/check_completion.py
      - run: python experiments/2026-10-25-w0/check_evidence.py
      - run: python experiments/2026-10-25-w1/check_evidence.py
      - run: python experiments/2026-10-25-w1/check_module_evidence.py
      - run: python experiments/2026-10-25-w1/check_cmake_evidence.py
      - run: python experiments/2026-10-25-w1/check_path_evidence.py
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - run: python -m pip install -r requirements-store.txt
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - run: cmake --version && ninja --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s tests -v
      - run: npm test
  rust-project-context:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: rustup toolchain install 1.94.0 --profile minimal --component rust-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download pinned rust-analyzer
        run: |
          python - <<'PY'
          import gzip, os, pathlib, urllib.request
          url='https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-19/rust-analyzer-x86_64-unknown-linux-gnu.gz'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'rust-analyzer'
          path.write_bytes(gzip.decompress(urllib.request.urlopen(url, timeout=60).read()))
          path.chmod(0o755)
          PY
      - run: python -m pip install -r requirements-store.txt
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - run: python -m unittest tests.test_executable_deployment_graph tests.test_cargo_declared_artifacts tests.test_cargo_source_bindings tests.test_cargo_file_api tests.test_rust_project tests.test_rust_facts tests.test_rust_semantics tests.test_rust_boundaries tests.test_path_values tests.test_rust_path_values tests.test_rust_argument_templates tests.test_project_snapshot.FullSnapshotTests.test_rust_fact_and_process_boundary_survive_the_mixed_production_builder tests.test_project_snapshot.FullSnapshotTests.test_native_cargo_artifact_to_renamed_distribution_survives_workspace_queries_and_failed_refresh tests.test_project_snapshot.FullSnapshotTests.test_default_rust_current_exe_chain_reaches_cmake_backend_entry -v
        env:
          PROJECT_MAP_RUST_ANALYZER: ${{ runner.temp }}/rust-analyzer
  skill-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install wheel setuptools mcp==2.3.0
      - run: python -m unittest tests.test_tool_workspace -v
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
      - run: python scripts/package_skill.py --wheel "$RUNNER_TEMP"/wheels/project_map_tool-*.whl --output "$RUNNER_TEMP/project-map-assistant.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: project-map-assistant
          path: ${{ runner.temp }}/project-map-assistant.zip
