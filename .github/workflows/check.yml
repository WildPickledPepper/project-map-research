name: Check research references
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_research.py
      - run: python scripts/check_trial_evidence.py
      - run: python scripts/check_p1_evidence.py
      - run: python scripts/check_p1_completion.py
      - run: python scripts/check_p2_completion.py
      - run: python scripts/check_p3_increment.py
      - run: python scripts/check_p3_selection.py
      - run: python scripts/check_p3_output_fields.py
      - run: python scripts/check_p3_serialization.py
      - run: python scripts/check_p3_response_routing.py
      - run: python scripts/check_p3_frontend_consumers.py
      - run: python scripts/check_p3_response_callbacks.py
      - run: python scripts/check_p3_request_correlation.py
      - run: python scripts/check_p3_transmission.py
      - run: python scripts/check_p3_socket_receivers.py
      - run: python scripts/check_p3_server_channels.py
      - run: python scripts/check_p3_return_bridge.py
      - run: python scripts/check_p3_completion.py
      - run: python experiments/2026-10-24-p5/check_completion.py
      - run: python experiments/2026-10-24-p7/check_completion.py
      - run: python experiments/2026-10-24-a1/check_completion.py
      - run: python experiments/2026-10-24-a2/check_completion.py
      - run: python experiments/2026-10-24-a3/check_completion.py
      - run: python experiments/2026-10-24-a4/check_evidence.py
      - run: python experiments/2026-10-24-a4-repair/check_completion.py
      - run: python experiments/2026-10-25-static-async/check_completion.py
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - run: python -m pip install -r requirements-store.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s tests -v
      - run: npm test
