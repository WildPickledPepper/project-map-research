[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-map-tool"
version = "0.2.1"
description = "Versioned cross-language project maps for coding agents"
requires-python = ">=3.11"

[project.optional-dependencies]
extract = ["tree-sitter==0.25.2", "tree-sitter-language-pack==1.20.0", "kuzu==0.11.3", "jedi==0.19.2", "parso==0.8.5"]
mcp = ["mcp==2.3.0"]
all = ["tree-sitter==0.25.2", "tree-sitter-language-pack==1.20.0", "kuzu==0.11.3", "jedi==0.19.2", "parso==0.8.5", "mcp==2.3.0"]

[project.scripts]
project-map = "projectmap.cli:main"

[tool.setuptools]
packages = ["projectmap", "adapters", "scripts"]
include-package-data = false

[tool.setuptools.package-data]
adapters = ["*.cjs"]
projectmap = ["_build_info.json"]
